[project]
name = "pi-incremental-py"
version = "0.1.0"
description = "Incremental reactive notebook kernel for agent-driven Python sessions"
requires-python = ">=3.12"

# No runtime dependencies: the kernel is stdlib-only (ast, symtable, importlib).
# The unittest suite runs on a bare interpreter; the property suite needs
# hypothesis and skips itself without it.
#     python3 -m unittest discover -s test-py
# With uv available:
#     uv run python -m unittest discover -s test-py
#     uvx ruff check py test-py

[dependency-groups]
dev = ["ruff", "hypothesis"]

[tool.ruff]
target-version = "py312"
src = ["py", "test-py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kernel", "protocol"]
