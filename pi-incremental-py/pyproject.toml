[project]
name = "pi-incremental-py"
version = "0.1.0"
description = "Incremental reactive notebook kernel for agent-driven Python sessions"
requires-python = ">=3.12"

# No runtime dependencies: the kernel is stdlib-only (ast, symtable, importlib).
# Tests are stdlib unittest, so a bare interpreter works:
#     python3 -m unittest discover -s tests
# With uv available:
#     uv run python -m unittest discover -s tests
#     uvx ruff check py tests

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
target-version = "py312"
src = ["py", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["reactive", "agent_kernel", "env_kernel"]
