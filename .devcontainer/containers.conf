# Configuration for the *inner* podman — the one this devcontainer runs, not the
# one on the host. See .devcontainer/Dockerfile.

[containers]
# The live suite calls a model API from inside the inner container, so it needs
# egress. slirp4netns gives it a real network namespace without requiring a
# bridge, so netavark/aardvark-dns/nftables stay out of this image. It needs
# /dev/net/tun passed into this container — see the Makefile.
netns = "slirp4netns"

[engine]
# There is no systemd in this container, so pin the manager rather than relying
# on podman's runtime autodetection.
cgroup_manager = "cgroupfs"
