name: test

on:
  push:
    branches: [main]
  pull_request:


jobs:
  # Whether this run can see the repository's secrets. A pull request from a fork
  # cannot, and the container tier needs to know: without a key it does not run
  # at all. The interactive tier deliberately does not consult this — its live
  # cases have no opt-out, so a fork pull request fails there rather than
  # reporting green over coverage it never had.
  #
  # It is a job rather than a top-level `env:` because a job-level `if:` cannot
  # read the `env` context — only `needs`, which is what this exists to provide.
  gate:
    name: secrets available?
    runs-on: ubuntu-24.04
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "has_secrets=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=0" >> "$GITHUB_OUTPUT"
          fi

  # The image's own suite: the git capability probe. A property of the pinned
  # digest, not of any package, so it runs once rather than once per extension —
  # outside the matrix for exactly that reason. Needs no key: nothing here drives
  # a model, so it runs on fork pull requests too.
  image:
    name: image userland (git capabilities)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The digest comes from shared/versions.env, the one place it is pinned.
      - run: SHARED_DIR=shared . shared/versions.sh && podman pull "$IMAGE"
      - run: shared/test/container/run-image-tests.sh

  unit:
    name: unit + types (host)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Adding an extension: one entry here, and one in PKGS in the Makefile.
      matrix:
        # pkg: [pi-issue-tracker, pi-incremental-py, pi-web-search]
        pkg: [pi-incremental-py] # to save CI minutes
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 strips TypeScript types natively, so there is no build step
          # and no test-framework dependency to install.
          node-version: "24"
          # The type-check is the only step here that installs anything, and both
          # scopes it installs are now shared by the whole repo rather than owned
          # by this package: the compiler and pi's declarations, which are large,
          # and the interactive tier's own dependencies, which are small but which
          # tsconfig.json's `include` reaches — see the note there.
          cache: npm
          cache-dependency-path: |
            shared/typecheck/package-lock.json
            shared/test/tui/package-lock.json
      - run: npm run test --if-present
      # Type-checks the extension against pi's real declarations, which the
      # script installs into shared/typecheck. Without them the pi types degrade
      # to `any` and the check passes without proving anything — see the note in
      # shared/tsconfig.base.json.
      - run: npm run typecheck --if-present
      # What `npm publish` would ship. `files` is an allowlist with no
      # .npmignore behind it, and a directory entry there quietly matches
      # whatever the toolchain left under it — which is how five .pyc files came
      # to be 77% of pi-incremental-py's tarball. Runs here rather than in the
      # release workflow as well as it: a tag is too late to find out.
      - run: npm run pack-check --if-present

  # The Python half. Outside the matrix on purpose: pi-incremental-py is the only
  # package with Python in it, so fanning this out would run three jobs to lint
  # one directory. It is also the only automation ruff has ever had — the README
  # documents the same command for a human to type, and an E501 lived in main
  # until someone did.
  lint:
    name: ruff (pi-incremental-py)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # An exact version, unlike the actions/* above: astral-sh publishes no
      # floating major tag (there is no `v10`, only `v10.0.1`), so a shorthand
      # here fails to resolve rather than tracking the major.
      - uses: astral-sh/setup-uv@v10.0.1
      # RUFF_VERSION comes from shared/versions.env, like every other pin in this
      # file. `--output-format=github` puts violations on the diff as annotations
      # rather than only in the log.
      - run: >
          SHARED_DIR=shared . shared/versions.sh
          && cd pi-incremental-py
          && uvx ruff@"$RUFF_VERSION" check --output-format=github py test-py

  tui:
    name: interactive (pty)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # pkg: [pi-issue-tracker, pi-incremental-py, pi-web-search]
        pkg: [pi-incremental-py] # to save CI minutes
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    env:
      # A few cases drive a real model, and test/tui/live.test.ts refuses to
      # start without this — there is no opt-out. A pull request from a fork
      # gets no secrets and so fails here, which is the intent: the live cases
      # are the only coverage an extension's entry point has, and a run that
      # quietly left them out would be green over nothing.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # pi-web-search's live tier refuses to start without this, same rule.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: shared/test/tui/package-lock.json
      # pi itself is under test here, so the version is pinned — a release that
      # changed the TUI would otherwise turn into a mystery failure. The pin is
      # PI_VERSION in shared/versions.env, the same file the type-check's pi
      # declarations are kept in step with.
      - name: install the pinned pi
        working-directory: .
        run: SHARED_DIR=shared . shared/versions.sh && npm i -g @earendil-works/pi-coding-agent@"$PI_VERSION"
      # ubuntu-24.04 already carries util-linux, so `script` — the pty the suite
      # runs pi inside — needs no install step here. PI_PROVIDER and PI_MODEL are
      # not set here either: `npm run test:tui` loads them from versions.env.
      - run: npm run test:tui --if-present

  container:
    name: container (image userland)
    runs-on: ubuntu-24.04
    needs: gate
    # test_extension_live.sh calls a model API with the repository's key, and a
    # pull request from a fork gets no secrets — the suite would exit 78 there
    # rather than fail informatively.
    if: needs.gate.outputs.has_secrets == '1'
    strategy:
      fail-fast: false
      # matrix:
      #   pkg: [pi-issue-tracker, pi-incremental-py, pi-web-search]
      matrix:
        pkg: [pi-incremental-py] # to save CI minutes
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    env:
      # The live tier is the only coverage an extension's entry point has;
      # without a key run.sh refuses to start rather than quietly skipping it.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ENGINE: podman
      # IMAGE, PI_PROVIDER and PI_MODEL are deliberately absent: the shared
      # driver loads them from shared/versions.env, which is the only place the
      # digest and the model are written down.
    steps:
      - uses: actions/checkout@v4
      - name: pull the pinned images
        working-directory: .
        # PY_TEST_IMAGE is pi-incremental-py's second image (the pinned userland
        # plus a Python). It is empty until first published, and its run.sh
        # builds locally in that case, so a missing pin must not fail the job
        # for the package that does not use it either.
        run: |
          SHARED_DIR=shared . shared/versions.sh
          podman pull "$IMAGE"
          if [ -n "${PY_TEST_IMAGE:-}" ]; then podman pull "$PY_TEST_IMAGE"; fi
      # The runner's podman is not nested, so none of the Makefile's flags apply.
      # The git capability probe is not run here — the `image` job covers it once
      # for every package.
      - run: npm run test:container --if-present
