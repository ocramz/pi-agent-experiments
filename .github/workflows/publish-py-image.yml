# Build and publish the image pi-incremental-py's container tier runs in: the
# pinned pi userland with a 3.12+ CPython added.
#
# Deliberately not on every push. The image only changes when its Containerfile
# or the base pin does, and the arm64 half is built under QEMU emulation, which
# is slow. Everything else consumes the result by digest.
name: publish py test image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pi-incremental-py/test/container/Containerfile
      - .github/workflows/publish-py-image.yml

concurrency:
  group: publish-py-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Both platforms, and this is not optional: CI is amd64 and the dev
      # machines are arm64. `podman pull` by digest does not enforce a platform,
      # so a single-arch image pulls fine on the wrong host and then dies at
      # `podman run` with "Exec format error" — the failure mode shared/versions.env
      # documents at length. QEMU is what makes the arm64 half buildable here.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: pi-incremental-py/test/container
          file: pi-incremental-py/test/container/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pi-container-py-node24:latest

      # The pin is a human commit, matching how DEFAULT_TEST_IMAGE is re-pinned.
      # steps.build.outputs.digest is the index digest — the multi-arch one the
      # invariant asks for — so this line can be pasted as-is.
      - name: print the line to pin
        run: |
          {
            echo '## Pin this in `shared/versions.env`'
            echo
            echo '```'
            echo "DEFAULT_PY_TEST_IMAGE=ghcr.io/${{ github.repository_owner }}/pi-container-py-node24@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo 'Then check it with `podman manifest inspect <ref>`: two platforms, not one.'
            echo
            echo 'First publish only: the GHCR package starts **private**, so make it public'
            echo 'in its package settings or neither CI nor `make test-container` can pull it.'
          } >> "$GITHUB_STEP_SUMMARY"
